<section id="top" class="relative h-[450px] md:h-[400px] overflow-hidden">
  <!-- Particles Background -->
  <ngx-particles
    [id]="id"
    [options]="particlesOptions"
    (particlesLoaded)="particlesLoaded($event)"
    class="absolute inset-0 w-full h-full"
  ></ngx-particles>

  <!-- Hero Content -->
  <div class="relative z-10 flex flex-col items-center justify-center h-full text-white">
    <div class="container mx-auto px-4 text-center">
      <h1 class="text-6xl md:text-7xl font-bold mb-4 text-white drop-shadow-lg">Matthew Leleux</h1>
      <p class="text-2xl md:text-3xl font-light text-white/90">Resume</p>
    </div>
  </div>
</section>
