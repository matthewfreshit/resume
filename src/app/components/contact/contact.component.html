<section id="contact" class="py-16 text-white" style="background: var(--color-dark)">
  <div class="container mx-auto px-4 md:px-24 lg:px-44">
    <h2 class="text-5xl font-light text-center mb-4 text-white">Contact</h2>
    <p class="text-center text-gray-300 mb-8">
      "Every time you have to speak, you are auditioning for leadership."<br>
      - James Humes
    </p>
    
    <hr class="border-gray-600 my-10 opacity-20">
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- LinkedIn -->
      <div class="flex items-center justify-center md:justify-start">
        <a 
          [href]="linkedInUrl" 
          target="_blank"
          class="flex items-center text-white hover:text-blue-300 transition-colors duration-200"
        >
          <svg class="w-8 h-8 mr-3" fill="currentColor" viewBox="0 0 24 24">
            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
          </svg>
          <span class="text-sm md:text-base">{{ linkedInUrl }}</span>
        </a>
      </div>
      
      <!-- Email -->
      <div class="flex items-center justify-center md:justify-end">
        <a 
          [href]="'mailto:' + email"
          class="flex items-center text-white hover:text-blue-300 transition-colors duration-200"
        >
          <svg class="w-8 h-8 mr-3" fill="currentColor" viewBox="0 0 24 24">
            <path d="M0 3v18h24v-18h-24zm21.518 2l-9.518 7.713-9.518-7.713h19.036zm-19.518 14v-11.817l10 8.104 10-8.104v11.817h-20z"/>
          </svg>
          <span class="text-sm md:text-base">{{ email }}</span>
        </a>
      </div>
    </div>
    
    <hr class="border-gray-600 my-10 opacity-20">
    
    <!-- Footer -->
    <div class="text-center text-gray-400 text-sm">
      <p>&copy; {{ currentYear }} Matthew Leleux. Built with Angular & Tailwind CSS.</p>
    </div>
  </div>
</section>
